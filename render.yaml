databases:
  - name: smartresume-db
    databaseName: smartresume
    user: smartresume
    plan: free

services:
  # Django Backend API
  - type: web
    name: smartresume-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: "./build.sh"
    startCommand: "cd backend && gunicorn smartresume.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartresume-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: PYTHON_VERSION
        value: "3.11.0"

  # Frontend Static Site
  - type: web
    name: smartresume-frontend
    runtime: static
    plan: free
    rootDir: frontend
    staticPublishPath: .
    envVars: []
