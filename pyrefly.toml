# Pyrefly configuration for SmartResume AI
# Tells Pyrefly that 'backend/' is a source root so 'apps.*' imports resolve correctly

[pyrefly]
# Source root includes the backend directory (where manage.py lives)
source_path = ["backend"]
python_interpreter = "venv/Scripts/python.exe"

# Suppress missing-import errors for known internal Django paths
ignore_missing_imports = true
